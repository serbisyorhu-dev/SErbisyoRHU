<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERbisyo RHU — Live Queue</title>
<link rel="icon" type="image/png" href="assets/logo-full.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Amo ni ang main colors kag background sang live queue TV. */
:root{--navy:#0B2A45;--blue-deep:#0F3D63;--blue:#1D6FA5;--green:#1E9E5A;--white:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:linear-gradient(160deg,#0B2A45 0%,#0F3D63 55%,#1D6FA5 100%);color:#fff;}
body{min-height:100vh;overflow-x:hidden;}
/* Ini ang RHU branding sa upper-left kag ginapunggan ang logo nga magdako. */
.brand{display:flex;align-items:center;gap:12px;position:fixed;top:22px;left:30px;z-index:10;}
.brand img{width:48px;height:48px;object-fit:contain;display:block;}
.brand-text b{display:block;font-family:'Poppins',sans-serif;font-size:19px;font-weight:800;}
.brand-text span{display:block;font-size:12px;opacity:.8;margin-top:1px;}
/* Ini ang live clock sa upper-right. */
.clock{position:fixed;top:31px;right:35px;font-size:18px;font-weight:600;opacity:.9;z-index:10;}
/* Ini ang main content kag dynamic doctor grid. */
.wrap{min-height:100vh;padding:92px 25px 58px;display:flex;flex-direction:column;align-items:center;}
.title{text-align:center;margin-bottom:17px;}
.title h1{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;}
.title p{margin-top:3px;font-size:13px;opacity:.75;}
.doctor-grid{width:100%;max-width:1700px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:stretch;}
/* Amo ni ang card sang tagsa ka doctor kag iya independent queue. */
.doctor-card{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:18px;text-align:center;backdrop-filter:blur(8px);box-shadow:0 8px 25px rgba(0,0,0,.12);}
.doctor-name{font-family:'Poppins',sans-serif;font-size:19px;font-weight:800;}
.doctor-department{margin-top:2px;font-size:12px;opacity:.74;}
.station{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.10);font-size:11px;font-weight:700;}
/* Ini ang green live indicator sang doctor nga may queue. */
.live-tag{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);padding:6px 14px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:1px;margin-top:14px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
/* Ini ang current queue number nga ginatawag subong. */
.now-serving-label{margin-top:12px;font-size:11px;font-weight:600;opacity:.7;letter-spacing:1.5px;}
.queue-number{font-family:'Poppins',sans-serif;font-weight:800;font-size:62px;line-height:1;margin-top:4px;text-shadow:0 6px 20px rgba(0,0,0,.25);}
.queue-service{font-size:13px;margin-top:7px;opacity:.86;min-height:20px;}
/* Ini ang next number kag waiting patients. */
.mini-stats{display:flex;justify-content:center;gap:35px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);}
.mini-stats div{min-width:90px;text-align:center;}
.mini-stats b{display:block;font-family:'Poppins',sans-serif;font-size:25px;font-weight:800;}
.mini-stats span{font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:.7px;}
/* Ini ang loading kag empty state. */
.empty-state{width:100%;max-width:850px;text-align:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:35px 25px;}
.empty-state h2{font-family:'Poppins',sans-serif;font-size:22px;}
.empty-state p{margin-top:5px;font-size:13px;opacity:.7;}
/* Ini ang connection warning kag footer. */
.error-banner{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);background:rgba(216,76,70,.95);padding:9px 18px;border-radius:9px;font-size:13px;display:none;z-index:20;white-space:nowrap;}
.footer{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:12px;opacity:.6;pointer-events:none;}
/* Ini naga-adjust sang layout sa mas gamay nga screen. */
@media(max-width:800px){.brand{left:15px;top:15px;}.brand img{width:40px;height:40px;}.brand-text b{font-size:15px;}.brand-text span{font-size:10px;}.clock{right:15px;top:24px;font-size:14px;}.wrap{padding:80px 12px 50px;}.title{margin-bottom:12px;}.title h1{font-size:21px;}.doctor-grid{grid-template-columns:1fr;gap:12px;}.queue-number{font-size:52px;}.footer{position:static;padding:15px 0 18px;}.error-banner{bottom:20px;}}
</style>
</head>
<body>
<!-- Ini ang RHU logo kag pangalan sa upper-left. -->
<div class="brand"><img src="assets/logo-full.png" alt="San Enrique RHU"><div class="brand-text"><b>San Enrique RHU</b><span>Live Queue Display</span></div></div>
<!-- Ini ang live clock nga naga-update kada segundo. -->
<div class="clock" id="clock">--:--</div>
<!-- Diri automatic nga makita ang tanan nga doctor queues. -->
<div class="wrap">
  <div class="title"><h1>Live Queue</h1><p>Please wait for your queue number to be called.</p></div>
  <div class="doctor-grid" id="doctorGrid"><div class="empty-state"><h2>Loading Queue…</h2><p>Connecting to SERbisyo RHU.</p></div></div>
</div>
<div class="error-banner" id="errorBanner">Could not reach the server — retrying…</div>
<div class="footer">SERbisyo RHU System — updates automatically every 5 seconds</div>
<script>
/* Amo ni ang existing Render backend URL sang SERbisyo RHU. */
const BACKEND_URL='https://serbisyorhu.onrender.com';
/* Ini naga-update sang oras kada segundo. */
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});}
updateClock();setInterval(updateClock,1000);
/* Ini nagaprotektar sang text halin sa backend antes ipakita sa HTML. */
function escapeHtml(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
/* Ini nagahimo sang A, B, C ... Z, AA, AB prefix kon wala ginpadala sang backend. */
function prefixFromIndex(index){let n=index+1,p='';while(n>0){n--;p=String.fromCharCode(65+(n%26))+p;n=Math.floor(n/26);}return p;}
/* Ini nagahimo sang card sang tagsa ka doctor kag iya independent queue. */
function doctorCard(doctor,index){
  const prefix=doctor.prefix||prefixFromIndex(index);
  const name=doctor.doctor_name||doctor.name||doctor.doctor||`Doctor ${index+1}`;
  const department=doctor.department||doctor.position||doctor.service||doctor.specialization||'Medical Doctor';
  const current=doctor.current_number||doctor.current_queue||doctor.queue_number||'—';
  const next=doctor.next_number||doctor.next_queue||'—';
  const waiting=doctor.waiting??doctor.waiting_count??0;
  const service=doctor.current_service||'Waiting for the next patient…';
  const stationName=doctor.station_name||doctor.station||'';
  const stationStatus=doctor.station_status||'';
  const stationHtml=stationName?`<div class="station">🏥 ${escapeHtml(stationName)}${stationStatus?` · ${escapeHtml(stationStatus)}`:''}</div>`:'';
  return `<div class="doctor-card" data-prefix="${escapeHtml(prefix)}">
    <div class="doctor-name">${escapeHtml(name)}</div>
    <div class="doctor-department">${escapeHtml(department)}</div>
    ${stationHtml}
    <div class="live-tag"><span class="live-dot"></span> NOW SERVING</div>
    <div class="now-serving-label">QUEUE NUMBER</div>
    <div class="queue-number">${escapeHtml(current)}</div>
    <div class="queue-service">${escapeHtml(service)}</div>
    <div class="mini-stats">
      <div><b>${escapeHtml(next)}</b><span>Next Number</span></div>
      <div><b>${escapeHtml(waiting)}</b><span>Patients Waiting</span></div>
    </div>
  </div>`;
}
/* Ini nagapakita sang tanan nga doctor cards nga ginbalik sang backend. */
function renderDoctorQueues(doctors){
  const grid=document.getElementById('doctorGrid');
  if(!doctors.length){grid.innerHTML='<div class="empty-state"><h2>No Active Queue</h2><p>Waiting for patients to check in.</p></div>';return;}
  grid.innerHTML=doctors.map((doctor,index)=>doctorCard(doctor,index)).join('');
}
/* Ini ang compatibility fallback para sa daan nga single-queue backend response. */
function renderOldQueue(data){
  const oldQueue={doctor_name:data.doctor_name||data.doctor||'RHU Queue',department:data.department||'San Enrique RHU',prefix:'A',current_number:data.current_number||'—',next_number:data.next_number||'—',waiting:data.waiting??0,current_service:data.current_service||'Waiting for the next patient…'};
  document.getElementById('doctorGrid').innerHTML=doctorCard(oldQueue,0);
}
/* Ini isa lang ka public request kada refresh kag automatic naga-update kada 5 seconds. */
async function refreshQueue(){
  const errorBanner=document.getElementById('errorBanner');
  try{
    const res=await fetch(`${BACKEND_URL}/api/public/queue-status`,{method:'GET',headers:{Accept:'application/json'},cache:'no-store'});
    if(!res.ok)throw new Error(`Server returned ${res.status}`);
    const data=await res.json();
    if(Array.isArray(data.doctors))renderDoctorQueues(data.doctors);else renderOldQueue(data);
    errorBanner.style.display='none';
  }catch(err){console.error('Queue display error:',err);errorBanner.style.display='block';}
}
refreshQueue();setInterval(refreshQueue,5000);
</script>
</body>
</html>
