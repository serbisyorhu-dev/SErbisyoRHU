<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — SERbisyo RHU System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f3654; --blue-deep:#124a76; --blue-mid:#2680c2;
    --ink:#132433; --ink-soft:#5b6b7a; --line:#e2e8ef; --bg:#eef2f6;
    --red:#d84c46; --red-light:#fbe9e8; --green:#1f9d55; --green-light:#e7f7ed;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:420px; background:#fff; border-radius:18px; padding:32px 28px;
    box-shadow:0 20px 50px -20px rgba(15,54,84,.25); border:1px solid var(--line);
  }
  .badge{
    width:52px; height:52px; border-radius:14px; margin:0 auto 16px;
    background:linear-gradient(160deg,#0f3654,#12866f); display:flex; align-items:center; justify-content:center;
  }
  h1{ font-family:'Poppins',sans-serif; font-size:19px; margin:0; text-align:center; color:var(--blue-deep); }
  p.sub{ text-align:center; color:var(--ink-soft); font-size:13.5px; margin:6px 0 24px; }
  label{ display:block; font-size:11px; font-weight:700; letter-spacing:.5px; color:#7c8a97; text-transform:uppercase; margin-bottom:6px; }
  input{
    width:100%; padding:12px 14px; border-radius:11px; border:1.5px solid var(--line);
    background:#f7f9fb; font-size:14px; outline:none; margin-bottom:16px;
  }
  input:focus{ border-color:var(--blue-mid); background:#fff; }
  button{
    width:100%; padding:13px; border:none; border-radius:999px; font-weight:700; font-size:14.5px;
    color:#fff; background:linear-gradient(180deg,var(--blue-mid),var(--blue-deep)); cursor:pointer;
  }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  .msg{ font-size:13px; padding:10px 12px; border-radius:10px; margin-bottom:16px; display:none; }
  .msg.show{ display:block; }
  .msg.err{ background:var(--red-light); color:var(--red); }
  .msg.ok{ background:var(--green-light); color:var(--green); }
  .links{ text-align:center; margin-top:18px; font-size:13px; }
  .links a{ color:var(--blue-mid); text-decoration:none; margin:0 8px; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z"/></svg>
    </div>
    <h1>Set a New Password</h1>
    <p class="sub" id="subtext">Enter a new password for your account.</p>

    <div id="msg" class="msg"></div>

    <form id="reset-form">
      <label>New Password</label>
      <input id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password">
      <label>Confirm Password</label>
      <input id="confirm" type="password" placeholder="••••••••" autocomplete="new-password">
      <button type="submit" id="submitBtn">Update Password</button>
    </form>

    <div class="links">
      <a href="index.html">Admin Login</a> · <a href="user.html">Patient App</a>
    </div>
  </div>

<script>
  // Supabase puts the recovery token in the URL FRAGMENT (after #), not a
  // normal query string — e.g. #access_token=...&type=recovery&...
  function getHashParams(){
    const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
    return new URLSearchParams(hash);
  }

  const params = getHashParams();
  const accessToken = params.get('access_token');
  const type = params.get('type');
  const form = document.getElementById('reset-form');
  const msgEl = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  function showMsg(text, kind){
    msgEl.textContent = text;
    msgEl.className = 'msg show ' + kind;
  }

  if (!accessToken || type !== 'recovery') {
    document.getElementById('subtext').textContent =
      'This link looks invalid or has expired. Request a new reset link from the login screen.';
    form.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password.length < 6) { showMsg('Password must be at least 6 characters.', 'err'); return; }
    if (password !== confirm) { showMsg('Passwords do not match.', 'err'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating…';

    try {
      // CHANGE THIS to your real deployed backend URL once you have one,
      // same as the BACKEND_URL constant in index.html.
       const BACKEND_URL = 'https://serbisyorhu.onrender.com';
      const res = await fetch(`${BACKEND_URL}/api/auth`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'update_password', access_token: accessToken, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not update password.');

      showMsg('Password updated! You can now log in with your new password.', 'ok');
      form.style.display = 'none';
    } catch (err) {
      showMsg(err.message, 'err');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';
    }
  });
</script>
</body>
</html>
